tools:
- name: search_catalog
  description: Find products matching the buyer's intent.
  source: https://haylou.com/llms.txt
- name: create_cart
  description: Create a cart and add the desired items.
  source: https://haylou.com/llms.txt
- name: create_checkout
  description: Start the purchase.
  source: https://haylou.com/llms.txt
- name: update_checkout
  description: Set the shipping address and shipping method.
  source: https://haylou.com/llms.txt
- name: complete_checkout
  description: Finalize the purchase. The buyer must explicitly approve payment — agents must not complete
