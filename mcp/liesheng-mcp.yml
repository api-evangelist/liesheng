source: https://haylou.com/llms.txt
notes: Liesheng's HAYLOU brand storefront exposes a live, publicly documented MCP endpoint implementing
  the Universal Commerce Protocol (UCP). The surface is provisioned by Shopify — the store runs on Shopify
  and Shopify serves UCP natively — rather than being hand-built by Liesheng, but it is genuinely reachable
  on the haylou.com origin and is the only MCP server in the Liesheng estate. The Suunto Cloud API has
  no MCP server and no OpenAPI to derive a candidate tool list from, so none has been invented for it.
server:
  name: haylou-ucp
  brand: HAYLOU
  transport: http
  protocol: mcp
  url: https://haylou.com/api/ucp/mcp
  canonical_url: https://myhaylou.myshopify.com/api/ucp/mcp
  method: POST
  content_type: application/json
  discovery: https://haylou.com/.well-known/ucp
  discovery_file: well-known/liesheng-haylou-ucp.json
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  platform: Shopify
  spec: https://ucp.dev
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
verification:
  probed: '2026-07-19'
  request: JSON-RPC tools/list POST
  http_status: 422
  response: '{"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"UCP discovery failed","data":{"code":"invalid_profile_url",...}}}'
  interpretation: The endpoint is live and speaks JSON-RPC; enumerating tools requires a registered UCP
