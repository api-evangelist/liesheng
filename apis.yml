apis:
- aid: liesheng:suunto-cloud-api
  name: Suunto Cloud API
  description: >-
    The Suunto Cloud API (also called the Integration API) gives approved partners
    OAuth2-authorized access to a Suunto App user's workout and daily-activity
    data. Workouts are delivered as FIT files carrying summary data (duration,
    average heart rate, distance) plus measured samples (heart rate, R-R data,
    power, altitude, temperature) and GPS tracks; daily activity covers steps and
    calories. Partners can also push workouts as FIT files and routes as GPX files
    back into a user's account for sync to Suunto watches. Webhook notifications
    announce newly synced workouts so partners fetch on demand rather than poll.
    Sleep data, points of interest and personal data such as weight or heart-rate
    zones are not yet exposed. Access is gated behind the Suunto partner program
    and is free of charge, but is not offered for personal use.
  humanURL: https://apizone.suunto.com/apis
  baseURL: https://cloudapi.suunto.com
