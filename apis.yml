- aid: liesheng:haylou-ucp
  name: HAYLOU Commerce (UCP/MCP)
  description: >-
    The HAYLOU brand storefront exposes an agent-facing commerce surface over the
    Universal Commerce Protocol, reachable as a live MCP endpoint. Agents can
    search the catalog, build a cart, create and update a checkout, and complete
    a purchase, alongside fulfillment, discount and order capabilities. Checkout
    requires explicit contemporaneous buyer approval before any payment is
    completed, and the endpoint is rate-limited per IP. The store also serves an
    llms.txt and agents.md describing read-only browsing routes for agents that
    only need product and collection data. This surface is provisioned by
    Shopify, which serves UCP natively for its stores, rather than being built by
    Liesheng — but it is genuinely served from the haylou.com origin and is the
    only MCP server in the Liesheng estate.
  humanURL: https://haylou.com/agents.md
  baseURL: https://haylou.com/api/ucp/mcp
  tags:
  - Commerce
  - Agentic Commerce
  - MCP
  - UCP
