aid: liesheng
name: Liesheng Group
description: >-
  Liesheng Group (猎声集团 / Liesheng Technology) is a Dongguan, Guangdong based
  consumer-electronics company founded on 25 May 2015 as one of Xiaomi's first
  ecosystem-chain suppliers. It operates as a global ODM/OEM solution provider —
  it engineered the Redmi AirDots true-wireless earbuds — while building its own
  brand portfolio, and reaches customers in more than 100 countries and regions.
  Liesheng launched the HAYLOU brand of wireless audio, smart wearables, bone-
  conduction headphones and microphones in 2017, and in 2022 acquired SUUNTO, the
  85-year-old Finnish premium sports-watch and outdoor-instrument brand, in the
  same year it raised a B round led by Cathay Capital and a B+ round led by Amer
  Sports. Liesheng publishes no corporate API of its own; its developer surface
  is the Suunto Cloud API (Integration API), a partner-gated OAuth2 workout and
  daily-activity data API served through the Suunto API Zone.
